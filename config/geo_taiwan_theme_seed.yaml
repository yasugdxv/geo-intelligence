# 台湾有事・台湾海峡危機 テーマのseedデータ。
#
# CLAUDE_CODE_BUILD_INSTRUCTIONS.md 7.2章に記載の初期12指標をそのまま登録する。
# 設計基準Excel「地政学インテリジェンス基盤_統合設計案_v2.xlsx」は未入手のため、
# より詳細な指標定義・シナリオ条件は入手後に反映する（docs/assumptions.md参照）。
#
# descriptionは「何を測定しているか」に加え、台湾有事のエスカレーション評価において
# 数値の増減が何を意味するかを記載する（危険度の断定ではなく、方向性の説明にとどめる。
# 実際の重大性判断は専門家・人が行う）。

theme:
  code: taiwan_strait
  name_ja: 台湾有事・台湾海峡危機
  name_en: Taiwan Strait Crisis
  description: >
    台湾を巡る軍事的・外交的・経済的緊張の高まりを監視する初期サンプルテーマ。
    専用ロジックとしてハードコードせず、Theme/Source/Indicator/Scenario/Alert Rule
    の設定データとして実装する。

indicators:
  - code: MIL-01
    name: PLA航空活動・中間線越境
    unit: 件/日
    mvp_enabled: true
    description: >
      台湾国防部の発表のうち、この指標に分類された事象の件数（直近30日）。
      件数がベースラインを上回るほど、中国軍機による台湾海峡中間線越境等の活動が
      活発化していることを示す。エスカレーション局面では、こうした日常的な軍事活動の
      頻度・規模の増加が先行指標として現れやすい。
  - code: MAR-01
    name: 中国海警・中国公船の活動
    unit: 件/日
    mvp_enabled: true
    description: >
      台湾海巡署の発表のうち、この指標に分類された事象の件数（直近30日）。
      中国海警局・公船による台湾周辺海域への進入・巡航等の頻度を示す。件数の増加は、
      海上での既成事実化・管轄権主張の強まりを示すシグナルになりうる。
  - code: MIL-02
    name: PLA大規模演習・部隊展開
    unit: 件
    mvp_enabled: true
    description: >
      台湾国防部の発表のうち、大規模演習・部隊展開に関する事象の件数（直近30日）。
      日常的な哨戒活動（MIL-01）とは区別し、より大規模な軍事的示威行動の頻度を捉える。
      演習の規模・頻度の急増は、軍事的準備態勢の引き上げを示す可能性がある。
  - code: CYB-01
    name: 重要インフラへのサイバー攻撃
    unit: 件
    mvp_enabled: true
    description: >
      國家資通安全研究院の資安週報のうち、重要インフラへのサイバー攻撃事案として
      分類された件数（直近30日）。有事の前段階で、後方かく乱・認知戦の一環として
      サイバー攻撃が増加する可能性が指摘されている。
  - code: POL-01
    name: 中国指導部・党文書の台湾表現
    unit: 定性
    mvp_enabled: true
    description: >
      大陸委員会関連の文書をLLMが「融和的／中立／強硬」の3段階に分類したもの。
      値が高い（強硬）ほど、公式な対台湾姿勢が厳しくなっていることを示す。
  - code: DIP-02
    name: 中台・米中危機対話チャンネル
    unit: 定性
    mvp_enabled: true
    description: >
      総統府の発言・声明をLLMが「正常／縮小／停止」の3段階に分類したもの。
      対話チャンネルの縮小・停止は、偶発的衝突を防ぐ緩衝機構が失われつつあることを
      意味し、一般にエスカレーションリスクが高まるシグナルとされる。
  - code: ECO-01
    name: 中国の対台湾経済措置
    unit: 件
    mvp_enabled: true
    description: >
      大陸委員会関連の文書のうち、対台湾の経済的措置（貿易制限等）に関する事象の
      件数。経済的圧力の強化は、軍事的手段以外での既成事実化・威嚇の手段として
      使われることが多い。
  - code: SCM-01
    name: TSMC・主要台湾企業の操業
    unit: 定性/指数
    mvp_enabled: true
    description: >
      TSMCの月次売上の前年同月比を操業状況の代理指標とする。半導体産業は台湾の
      経済的・地政学的重要性の中核であり、大幅な落ち込みはサプライチェーンへの
      懸念・混乱を示唆しうる（高成長はむしろ平常運転を示す）。
  - code: LOG-01
    name: 台湾海峡・台湾港湾の商業通航
    unit: 隻/日
    mvp_enabled: true
    description: >
      （未実装）実装できれば、海峡・港湾の商船航行量の増減から、海上封鎖・物流途絶の
      予兆を検知できる可能性がある。無料の公開データが無く、AIS取得の契約判断が必要。
  - code: FIN-01
    name: 海上保険・戦争リスク料率
    unit: '%'
    mvp_enabled: true
    description: >
      （未実装）実装できれば、保険市場が有事リスクをどれだけ織り込んでいるかを、
      実際の資金が伴う評価として捉えられる。無料の公開データが存在しない。
  - code: MKT-01
    name: TAIEX・TWD・ボラティリティ
    unit: 指数
    mvp_enabled: true
    description: >
      台湾株式市場(TAIEX)の当日変動率を市場ボラティリティの代理指標とする。
      市場参加者が地政学リスクをどう織り込んでいるかを反映し、変動率の急上昇は
      市場が緊張を強く意識し始めたことを示唆する。
  - code: JPN-01
    name: 邦人保護・退避準備
    unit: 定性
    mvp_enabled: true
    description: >
      外務省海外安全ホームページの危険情報レベル(0〜4)をそのまま抽出。日本政府が
      公式にどの段階の注意喚起をしているかを示し、レベルが上がるほど邦人の安全確保・
      退避に関する公式な警戒度が高まっていることを意味する。
